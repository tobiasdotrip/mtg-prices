[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-prices"
version = "0.4.1"
description = "MTG card price tracker using Scryfall API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "tobiasdotrip" },
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.12",
]

[project.scripts]
mtg-prices = "mtg_prices.cli:main"

[project.urls]
Homepage = "https://github.com/tobiasdotrip/mtg-prices"
Repository = "https://github.com/tobiasdotrip/mtg-prices"
Issues = "https://github.com/tobiasdotrip/mtg-prices/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_prices"]
artifacts = ["src/mtg_prices/migrations/*.sql"]
